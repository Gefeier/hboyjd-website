# 贴进 /www/server/panel/vhost/nginx/hboyjd.com.conf 的 443 server 块(放在询价 /api/inquiry 那段后面)
    # 官网自有访问统计埋点(2026-09-28 加):只记日志不落盘文件,由 /opt/site-stats/ingest.py 汇总
    location = /_hit {
        access_log /www/wwwlogs/hboyjd.hit.log hboyjd_hit;
        limit_req zone=hboyjd_hit burst=20 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        return 204;
    }
